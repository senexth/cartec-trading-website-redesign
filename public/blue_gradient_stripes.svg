<svg width="400" height="800" viewBox="0 0 400 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="30%" stop-color="#0055d4" />
      <stop offset="65%" stop-color="#02132e" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <pattern id="stripes" width="8" height="10" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10"
            stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  <rect width="100%" height="100%" fill="url(#stripes)" />
</svg>